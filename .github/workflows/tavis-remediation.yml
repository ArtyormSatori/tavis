name: TAVIS Remediation TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/tavis_*.rs'
      - '.github/workflows/tavis-remediation.yml'
  push:
    branches:
      - 'tavis/phase0-6-remediation'
    paths:
      - 'src/**'
      - 'tests/tavis_*.rs'
      - '.github/workflows/tavis-remediation.yml'

permissions:
  contents: read

jobs:
  omniroute-policy:
    name: OmniRoute policy RED/GREEN gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TAVIS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run OmniRoute policy test
        run: cargo test --test tavis_omniroute_policy -- --nocapture
