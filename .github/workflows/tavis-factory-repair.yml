name: TAVIS Factory Repair

on:
  push:
    branches:
      - tavis/phase0-6-remediation
    paths:
      - .github/workflows/tavis-factory-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: tavis/phase0-6-remediation
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact OpenHuman factory baseline
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object src/openhuman/inference/provider/factory.rs)"
          expected="6f3bdc4e8c9d2c71ab59f8f2512368e7751cf1ce"
          test "$actual" = "$expected" || {
            echo "factory baseline mismatch: $actual != $expected" >&2
            exit 1
          }

      - name: Apply minimal TAVIS chokepoint patch
        run: python3 scripts/remediation/patch-tavis-omniroute-chokepoint.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify patched factory formatting only
        run: rustfmt --edition 2021 --check src/openhuman/inference/provider/factory.rs

      - name: Verify OmniRoute policy
        run: cargo test --test tavis_omniroute_policy -- --nocapture

      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/remediation/patch-tavis-omniroute-chokepoint.py
          rm -f .github/workflows/tavis-factory-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/openhuman/inference/provider/factory.rs \
                  scripts/remediation/patch-tavis-omniroute-chokepoint.py \
                  .github/workflows/tavis-factory-repair.yml
          git diff --cached --check
          git commit -m "fix: fail closed TAVIS role routing to OmniRoute"
          git push origin HEAD:tavis/phase0-6-remediation
