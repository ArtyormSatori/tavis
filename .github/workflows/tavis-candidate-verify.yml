name: TAVIS Candidate Verify

on:
  push:
    branches:
      - tavis/verify-phase0-12-candidate

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: TAVIS reference-only provenance
        run: bash tests/tavis_reference_only_guard.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Materialize fail-closed patches into candidate source once
        shell: bash
        run: |
          set -euo pipefail
          LOAD=src/openhuman/config/schema/load/impl_load.rs
          FACTORY=src/openhuman/inference/provider/factory.rs

          load_hooks=$(grep -c 'crate::openhuman::config::apply_tavis_defaults(&mut config);' "$LOAD" || true)
          if grep -q 'TAVIS_OMNIROUTE_ONLY' "$FACTORY" && [ "$load_hooks" -ge 7 ]; then
            echo 'TAVIS_NATIVE_PATCHES_ALREADY_MATERIALIZED'
          else
            python3 scripts/remediation/patch-tavis-config-load-finalizer.py
            python3 scripts/remediation/patch-tavis-omniroute-chokepoint.py
          fi

          if ! git diff --quiet -- "$LOAD" "$FACTORY"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$LOAD" "$FACTORY"
            git commit -m 'feat: integrate TAVIS fail-closed policy into OpenHuman runtime'
            git push origin HEAD:tavis/verify-phase0-12-candidate
          fi
      - name: TAVIS policy tests
        run: >-
          cargo test
          --test tavis_omniroute_policy
          --test tavis_omniroute_model_construction
          --test tavis_omniroute_explicit_bypass
          --test tavis_config_load_policy
          --test tavis_agent_evidence
          --test tavis_native_capabilities
          --test tavis_knowledge_graph
          --test tavis_supervisor_policy
          --test tavis_control_policy
          --test tavis_update_policy
          --test tavis_voice_policy
          --test tavis_hardening_policy
          -- --nocapture
      - name: Rust format
        run: cargo fmt --check
