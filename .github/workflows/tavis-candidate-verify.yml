name: TAVIS Candidate Verify

on:
  push:
    branches:
      - tavis/verify-phase0-12-candidate

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate fail-closed patches
        run: |
          python3 scripts/remediation/patch-tavis-config-load-finalizer.py
          python3 scripts/remediation/patch-tavis-omniroute-chokepoint.py
      - name: TAVIS policy tests
        run: >-
          cargo test
          --test tavis_omniroute_policy
          --test tavis_omniroute_model_construction
          --test tavis_config_load_policy
          --test tavis_agent_evidence
          --test tavis_native_capabilities
          --test tavis_knowledge_graph
          --test tavis_supervisor_policy
          --test tavis_control_policy
          --test tavis_update_policy
          --test tavis_voice_policy
          --test tavis_hardening_policy
          -- --nocapture
      - name: Rust format
        run: cargo fmt --check
